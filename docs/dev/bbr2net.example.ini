# Developer settings (players do not need this). Copy this file to bbr2mod\bbr2net.ini.
dev=0             # 1: F9 / Ctrl+R restarts the last race offline
# bbr2net settings - read again at the start of every race
shadow=0          # 1: shadow car test on, 0: the mod touches nothing
shadow_ai=0       # slot of the opponent to turn into a puppet (0-6)
delay_ms=100      # simulated network delay (one way)
jitter_ms=20      # delay jitter (+/-)
loss_pct=5        # packet loss percentage
send_hz=30        # state packets sent per second
offset=3.5,0,0    # local offset of the puppet from your car (m)
trail_s=0         # >0: the puppet follows you this many seconds behind (set offset to 0,0,0)
pos_gain=0.15
vel_gain=0.4
rot_gain=0.15
ang_gain=0.4
snap_dist=6       # teleport when the error is larger than this (m)
max_extrap=0.5    # longest extrapolation (s)
copy_ctl=1        # copy steering/throttle inputs to the puppet
